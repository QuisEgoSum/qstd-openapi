[mypy]
python_version = 3.9

mypy_path = src

explicit_package_bases = True

check_untyped_defs = True
disallow_untyped_defs = True
disallow_any_generics = True
strict_optional = True
warn_redundant_casts = True

exclude = (?x)(.venv | build)

# Third-party code that uses syntax newer than 3.9 (the check targets 3.9).
[mypy-openapi_spec_validator.*]
follow_imports = skip

# Dev versions of Sanic, FastAPI and their dependencies require 3.10+.
[mypy-sanic.*,sanic_testing.*,sanic_routing.*,fastapi.*,starlette.*,anyio.*,httpx.*]
follow_imports = skip
