[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qstd-openapi"
version = "0.1.0"
description = """\
A framework-agnostic, declarative OpenAPI 3.1/3.0 generator: decorators, \
error classes, webhooks and document aggregation, with Pydantic and Sanic integrations \
(FastAPI and Pydantic 1 — experimental).\
"""
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "QuisEgoSum", email = "subbotin.evdokim@gmail.com" },
]
license = "MIT"
requires-python = ">=3.9"
keywords = ["openapi", "swagger", "redoc", "pydantic", "sanic", "fastapi", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.6,<3"]
pydantic-v1 = ["pydantic>=1.10,<2"]  # experimental
validate = ["openapi-spec-validator>=0.7"]
sanic = ["sanic>=23.12"]
fastapi = ["fastapi>=0.110"]  # experimental
yaml = ["PyYAML>=6"]
all = ["pydantic>=2.6,<3", "openapi-spec-validator>=0.7", "sanic>=23.12", "fastapi>=0.110", "PyYAML>=6"]
dev = [
    "pydantic>=2.6,<3",
    "openapi-spec-validator>=0.7",
    "sanic>=23.12",
    "sanic-testing>=23.12",
    "fastapi>=0.110",
    "httpx>=0.24",
    "PyYAML>=6",
    "pytest>=8.0,<9.0",
    "tox>=4.26.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.11.2",
    "black>=25.1.0",
    "build>=1.2.2",
    "twine>=6.1.0",
    "pyright>=1.1.402",
    "mypy>=1.16,<2",  # 2.x cannot target Python 3.9
]

[project.urls]
"Homepage" = "https://github.com/QuisEgoSum/qstd-openapi"
"Repository" = "https://github.com/QuisEgoSum/qstd-openapi"
"Changelog" = "https://github.com/QuisEgoSum/qstd-openapi/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/QuisEgoSum/qstd-openapi/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
qstd_openapi = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "tests", "examples"]
exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PERF", "TRY", "ERA", "C4", "SIM", "TID", "T20", "ARG", "COM812", "D204"]
ignore = ["SIM102", "UP007", "UP045", "TRY003", "E501"]

[tool.ruff.lint.per-file-ignores]
# Sanic passes request/path arguments to handlers whether they are used or not.
"tests/test_sanic.py" = ["ARG001", "ARG002"]
"examples/sanic_service/app.py" = ["ARG001"]
"examples/fastapi_augment/app.py" = ["ARG001"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-between-types = 1

[tool.black]
line-length = 88
target-version = ["py39"]
skip-string-normalization = true

[tool.uv]
conflicts = [
    [{ extra = "pydantic" }, { extra = "pydantic-v1" }],
    [{ extra = "dev" }, { extra = "pydantic-v1" }],
    [{ extra = "all" }, { extra = "pydantic-v1" }],
]
