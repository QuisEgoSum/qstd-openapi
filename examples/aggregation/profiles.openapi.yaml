openapi: 3.1.0
info:
  title: Profiles API
  version: 1.0.0
paths:
  /{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: integer
        display_name:
          type: string
